name: Validate Factory Simple-Cast signing
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/factory-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-signing:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNING_STORE_FILE: ${{ github.workspace }}/factory/simple-cast.jks
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      CAST_RECEIVER_ID: ${{ vars.CAST_RECEIVER_ID }}
    steps:
      - name: Verify Factory read token present
        env:
          FACTORY_READ_TOKEN: ${{ secrets.FACTORY_READ_TOKEN }}
        run: |
          test -n "$FACTORY_READ_TOKEN" || { echo "::error::FACTORY_READ_TOKEN missing"; exit 1; }
      - name: Checkout private Factory (main)
        uses: actions/checkout@v4
        with:
          repository: sopra59-lgtm/Factory
          ref: main
          path: factory
          token: ${{ secrets.FACTORY_READ_TOKEN }}
          persist-credentials: false
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore historical signing key
        working-directory: factory
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Original keystore secret missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "simple-cast.jks"
      - name: Build signed APK (no publication)
        working-directory: factory/apps/simple-cast
        run: gradle --no-daemon assembleRelease
      - name: Verify APK matches original signing certificate
        shell: bash
        working-directory: factory/apps/simple-cast
        run: |
          set -euo pipefail
          APKTOOL="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          generated=app/build/outputs/apk/release/app-release.apk
          "$APKTOOL" verify --verbose "$generated"
          mkdir -p "$RUNNER_TEMP/legacy-release"
          gh release download "v44" --repo sopra59-lgtm/Simple-Cast --pattern "simple-cast.apk" --dir "$RUNNER_TEMP/legacy-release"
          original="$RUNNER_TEMP/legacy-release/simple-cast.apk"
          original_sha=$("$APKTOOL" verify --print-certs "$original" | grep -m1 'Signer #1 certificate SHA-256 digest:' | awk '{print $NF}')
          generated_sha=$("$APKTOOL" verify --print-certs "$generated" | grep -m1 'Signer #1 certificate SHA-256 digest:' | awk '{print $NF}')
          test -n "$original_sha" && test -n "$generated_sha"
          if [[ "$original_sha" != "$generated_sha" ]]; then
            echo "::error::Signing certificate differs from historically published APK"
            exit 1
          fi
          echo "SUCCESS: Factory source build signed with original certificate"
      - name: Remove keystore
        if: always()
        run: rm -f "factory/simple-cast.jks"
