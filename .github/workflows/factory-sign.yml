name: Sign Factory Simple-Cast APK
on:
  push:
    branches: [main]
    paths: ['.github/factory-release-trigger.txt']
  workflow_dispatch:
    inputs:
      factory_ref:
        description: 'Factory commit SHA or branch (main)'
        required: true
        default: main
        type: string
      version_name:
        description: 'Android versionName'
        required: true
        default: '0.4.45'
        type: string
      version_code:
        description: 'Android versionCode (must increase)'
        required: true
        default: '45'
        type: string

permissions:
  contents: write

jobs:
  sign-and-publish:
    runs-on: ubuntu-latest
    environment: factory-signing
    env:
      APP_VERSION_NAME: ${{ inputs.version_name || '0.4.45' }}
      APP_VERSION_CODE: ${{ inputs.version_code || '45' }}
      GH_TOKEN: ${{ github.token }}
      SIGNING_STORE_FILE: ${{ github.workspace }}/factory/simple-cast.jks
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      CAST_RECEIVER_ID: ${{ vars.CAST_RECEIVER_ID }}
    steps:
      - name: Check out Factory source (private repository)
        uses: actions/checkout@v4
        with:
          repository: sopra59-lgtm/Factory
          ref: ${{ inputs.factory_ref || 'main' }}
          token: ${{ secrets.FACTORY_READ_TOKEN }}
          path: factory
          persist-credentials: false
      - name: Validate version and credentials
        working-directory: factory/apps/simple-cast
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$KEYSTORE_BASE64" ]] || { echo "::error::Original signing key secret missing"; exit 1; }
          [[ "$APP_VERSION_CODE" =~ ^[0-9]+$ ]] || exit 1
          (( APP_VERSION_CODE > 44 )) || { echo "::error::versionCode must exceed 44"; exit 1; }
          [[ "$APP_VERSION_NAME" == "0.4.$APP_VERSION_CODE" ]] || exit 1
          if gh release view "v${APP_VERSION_CODE}" --repo "sopra59-lgtm/Simple-Cast" >/dev/null 2>&1; then
            echo "::error::Release already exists"; exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore original keystore
        working-directory: factory
        shell: bash
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "simple-cast.jks"
      - name: Build signed APK from Factory
        working-directory: factory/apps/simple-cast
        run: gradle --no-daemon assembleRelease
      - name: Verify signature
        working-directory: factory/apps/simple-cast
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Publish to historic releases channel
        working-directory: factory/apps/simple-cast
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/simple-cast.apk"
          gh release create "v${APP_VERSION_CODE}" "$RUNNER_TEMP/simple-cast.apk" --repo "sopra59-lgtm/Simple-Cast" --target main --title "Simple-Cast v${APP_VERSION_CODE}" --notes "Built from Factory: $GITHUB_SHA (Factory ref: ${{ inputs.factory_ref || 'main' }})."
      - name: Clean up keystore
        if: always()
        run: rm -f "factory/simple-cast.jks"
