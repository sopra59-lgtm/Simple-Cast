plugins { id 'com.android.application' }

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '2').toInteger()
def releaseKeystore = System.getenv('SIGNING_STORE_FILE')
def releaseSigningReady = releaseKeystore &&
        System.getenv('SIGNING_STORE_PASSWORD') &&
        System.getenv('SIGNING_KEY_ALIAS') &&
        System.getenv('SIGNING_KEY_PASSWORD')

android {
    namespace 'fr.nuapp.simplecast'
    compileSdk 35
    defaultConfig {
        applicationId 'fr.nuapp.simplecast'
        minSdk 29
        targetSdk 35
        versionCode = runNumber
        versionName = "0.4.${runNumber}"
    }
    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile = file(releaseKeystore)
                storePassword = System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias = System.getenv('SIGNING_KEY_ALIAS')
                keyPassword = System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningReady) signingConfig = signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
