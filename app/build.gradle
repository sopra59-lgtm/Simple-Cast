plugins { id 'com.android.application' }
android {
    namespace 'fr.nuapp.simplecast'
    compileSdk 35
    defaultConfig {
        applicationId 'fr.nuapp.simplecast'
        minSdk 29
        targetSdk 35
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '2').toInteger()
        versionName '0.2.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '2')
    }
    signingConfigs {
        release {
            def storePath=System.getenv('SIGNING_STORE_FILE')
            if(storePath) {
                storeFile file(storePath)
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
